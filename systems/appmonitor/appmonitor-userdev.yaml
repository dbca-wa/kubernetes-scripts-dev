apiVersion: apps/v1
kind: Deployment
metadata:
  name: appmonitor-userdev
spec:
  replicas: 1
  strategy:
    type: Recreate  
  selector:
    matchLabels:
      workload.user.cattle.io/workloadselector: apps.deployment-{{namespace}}-appmonitor-userdev
  template:
    metadata:
      labels:
        workload.user.cattle.io/workloadselector: apps.deployment-{{namespace}}-appmonitor-userdev
    spec:    
      securityContext:
        fsGroup: 20000                 # Automatically updates disk contents to group 20000
        supplementalGroups: [20000]
        fsGroupChangePolicy: "OnRootMismatch" # Skips chown on subsequent boots    
      tolerations:
        - effect: NoSchedule
          key: kubernetes.azure.com/scalesetpriority
          operator: Equal
          value: spot                   
      tolerations:
        - effect: NoSchedule
          key: kubernetes.azure.com/scalesetpriority
          operator: Equal
          value: spot                   
      containers:
        - env:
            - name: DEBUG
              value: 'True'
            - name: ENABLE_WEB
              value: 'False'
            - name: ENABLE_CRON
              value: 'False'
          envFrom:
            - secretRef:
                name: {{system}}-{{namespace}}-userdev
                optional: false                   
          name: appmonitor-userdev
          image: ghcr.io/dbca-wa/docker_app_dev:appmonitor_dev_latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: tcp8080
              protocol: TCP
          stdin: true          
          tty: true     
          volumeMounts:
            - mountPath: /data/
              name: appmonitor-userdev
              subPath: data                  
            - mountPath: /home/container/
              name: appmonitor-userdev
              subPath: container   
          workingDir: /data/data/projects/appmonitor/
          resources:
            limits:
              cpu: '1'
              memory: 4Gi
            requests:
              cpu: 10m
              memory: 2Gi          
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL          
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 200000    
            runAsGroup: 20000
      volumes:
        - name:  appmonitor-userdev
          persistentVolumeClaim:
            claimName: appmonitor-userdev
            
