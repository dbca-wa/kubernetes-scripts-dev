apiVersion: apps/v1
kind: Deployment
metadata:
  name: parkstayv2-userdev
spec:
  replicas: 1
  strategy:
    type: Recreate  
  selector:
    matchLabels:
      workload.user.cattle.io/workloadselector: apps.deployment-{{namespace}}-parkstayv2-userdev
  template:
    metadata:
      labels:
        workload.user.cattle.io/workloadselector: apps.deployment-{{namespace}}-parkstayv2-userdev	
    spec:
      securityContext:
        fsGroup: 20000                 # Automatically updates disk contents to group 20000
        supplementalGroups: [20000]
        fsGroupChangePolicy: "OnRootMismatch" # Skips chown on subsequent boots      
      initContainers:
        - name: folder-initializer
          image: ghcr.io/dbca-wa/docker-apps-dev:busybox_base_latest
          # Mount the raw, bare volume WITHOUT subpaths so we can fix the directories
          volumeMounts:
            - name: {{system}}-userdev
              mountPath: /mnt/storage/
          # We create the folders natively. Because fsGroup is active, 
          # these folders will inherit group 20000 access.
          command: ["sh", "-c", "mkdir -p /mnt/storage/data /mnt/storage/container /mnt/storage/data/data/projects/parkstay_bs_v2/"]              
          securityContext:
            runAsNonRoot: true
            runAsUser: 200000   # Standard user, NOT root
            runAsGroup: 20000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            seccompProfile:
              type: RuntimeDefault            
            capabilities:
              drop:
                - ALL    
      tolerations:
        - effect: NoSchedule
          key: kubernetes.azure.com/scalesetpriority
          operator: Equal
          value: spot                   
      containers:
        - env:
            - name: ENABLE_WEB
              value: 'False'
            - name: ENABLE_CRON
              value: 'False'
          envFrom:
            - secretRef:
                name: {{system}}-{{namespace}}-userdev
                optional: false                
          name: parkstayv2-userdev
          image: ghcr.io/dbca-wa/docker_app_dev:parkstay_v2_latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: tcp8080
              protocol: TCP
          stdin: true          
          tty: true     
          volumeMounts:
            - mountPath: /data/
              name: parkstayv2-userdev
              subPath: data                  
            - mountPath: /home/container/
              name: parkstayv2-userdev
              subPath: container   
          workingDir: /data/data/projects/parkstay_bs_v2/
          resources:
            limits:
              cpu: '2'
              memory: 5Gi
            requests:
              cpu: 10m
              memory: 1Gi          
          securityContext:
            runAsNonRoot: true
            runAsUser: 200000   # Standard user, NOT root
            runAsGroup: 20000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            seccompProfile:
              type: RuntimeDefault            
            capabilities:
              drop:
                - ALL          
      volumes:
        - name:  parkstayv2-userdev
          persistentVolumeClaim:
            claimName: parkstayv2-userdev
            
