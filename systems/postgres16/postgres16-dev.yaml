apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres16-userdev
spec:
  replicas: 1
  strategy:
    type: Recreate  
  selector:
    matchLabels:
      workload.user.cattle.io/workloadselector: apps.deployment-{{namespace}}-postgres16-userdev
  template:
    metadata:
      labels:
        workload.user.cattle.io/workloadselector: apps.deployment-{{namespace}}-postgres16-userdev
    spec:
      securityContext:
        fsGroup: 999                 # Automatically updates disk contents to group 999
        supplementalGroups: [999]
        fsGroupChangePolicy: "OnRootMismatch" # Skips chown on subsequent boots     
      initContainers:
        - name: folder-initializer
          image: ghcr.io/dbca-wa/docker-apps-dev:busybox_base_latest
          # Mount the raw, bare volume WITHOUT subpaths so we can fix the directories
          volumeMounts:
            - name: {{system}}-userdev
              mountPath: /mnt/storage/
          # We create the folders natively. Because fsGroup is active, 
          # these folders will inherit group 20000 access.
          command: ["sh", "-c", "mkdir -p /mnt/storage/data /mnt/storage/container  /var/lib/postgresql/data/data"]              
          securityContext:
            runAsNonRoot: true
            runAsUser: 999   # Standard user, NOT root
            runAsGroup: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            seccompProfile:
              type: RuntimeDefault            
            capabilities:
              drop:
                - ALL    
      containers:
        - env:            
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          envFrom:                 
            - secretRef:
                name: {{system}}-{{namespace}}-userdev
                optional: false                         
          name: postgres16-userdev
          image: ghcr.io/dbca-wa/docker-apps-dev:postgres16_latest  
          imagePullPolicy: Always
          ports:
            - containerPort: 5432
              name: tcp5432
              protocol: TCP
          stdin: true          
          tty: true     
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgres16-userdev
              subPath: data                      
          resources:
            limits:
              cpu: '3'
              memory: 4Gi
            requests:
              cpu: 10m
              memory: 1Gi          
          securityContext:
            runAsNonRoot: true
            runAsUser: 999   # Standard user, NOT root
            runAsGroup: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            seccompProfile:
              type: RuntimeDefault            
            capabilities:
              drop:
                - ALL                   
      volumes:
        - name:  postgres16-userdev
          persistentVolumeClaim:
            claimName: postgres16-userdev          

