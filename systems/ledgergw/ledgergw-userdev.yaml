apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledgergw-userdev
spec:
  replicas: 1
  strategy:
    type: Recreate  
  selector:
    matchLabels:
      workload.user.cattle.io/workloadselector: apps.deployment-{{namespace}}-ledgergw-userdev
  template:
    metadata:
      labels:
        workload.user.cattle.io/workloadselector: apps.deployment-{{namespace}}-ledgergw-userdev	
    spec:
      securityContext:
        fsGroup: 20000                 # Automatically updates disk contents to group 20000
        supplementalGroups: [20000]
        fsGroupChangePolicy: "OnRootMismatch" # Skips chown on subsequent boots      
      initContainers:
        - name: folder-initializer
          image: ghcr.io/dbca-wa/docker-apps-dev:busybox_base_latest
          # Mount the raw, bare volume WITHOUT subpaths so we can fix the directories
          volumeMounts:
            - name: {{system}}-userdev
              mountPath: /mnt/storage/
          # We create the folders natively. Because fsGroup is active, 
          # these folders will inherit group 20000 access.
          command: ["sh", "-c", "mkdir -p /mnt/storage/data /mnt/storage/container /mnt/storage/data/data/projects/ledger/"]              
          securityContext:
            runAsNonRoot: true
            runAsUser: 200000   # Standard user, NOT root
            runAsGroup: 20000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            seccompProfile:
              type: RuntimeDefault            
            capabilities:
              drop:
                - ALL  
      tolerations:
        - effect: NoSchedule
          key: kubernetes.azure.com/scalesetpriority
          operator: Equal
          value: spot                   
      tolerations:
        - effect: NoSchedule
          key: kubernetes.azure.com/scalesetpriority
          operator: Equal
          value: spot              
      containers:
        - env:
          envFrom:
            - secretRef:
                name: {{system}}-{{namespace}}-userdev
                optional: false                  
          name: ledgergw-userdev
          image: ghcr.io/dbca-wa/docker_app_dev:ledger_dev_latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: tcp8080
              protocol: TCP
            - containerPort: 9021
              name: tcp9021
              protocol: TCP              
          stdin: true          
          tty: true     
          volumeMounts:
            - mountPath: /data/
              name: ledgergw-userdev
              subPath: data                  
            - mountPath: /home/container/
              name: ledgergw-userdev
              subPath: container   
            - mountPath: /app/.vscode-server/
              name: ledgergw-userdev
              subPath: vscode-server                 
          workingDir: /app
          resources:
            limits:
              cpu: '2'
              memory: 5Gi
            requests:
              cpu: 10m
              memory: 1Gi          
          securityContext:
            runAsNonRoot: true
            runAsUser: 200000   # Standard user, NOT root
            runAsGroup: 20000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            seccompProfile:
              type: RuntimeDefault            
            capabilities:
              drop:
                - ALL   
      volumes:
        - name:  ledgergw-userdev
          persistentVolumeClaim:
            claimName: ledgergw-userdev

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{namespace}}8080-ledger-userdev-appsteam.dbca.wa.gov.au
  namespace: {{namespace}}
  annotations:
    # Optional: specifically for NGINX Ingress Controller
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: {{namespace}}8080-ledger-userdev-appsteam.dbca.wa.gov.au
    http:
      paths:
      - backend:
          service:
            name: ledgergw-userdev
            port:
              number: 8080
        pathType: ImplementationSpecific

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{namespace}}9021-ledger-userdev-appsteam.dbca.wa.gov.au
  namespace: {{namespace}}
  annotations:
    # Optional: specifically for NGINX Ingress Controller
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: {{namespace}}9021-ledger-userdev-appsteam.dbca.wa.gov.au
    http:
      paths:
      - backend:
          service:
            name: ledgergw-userdev
            port:
              number: 9021
        pathType: ImplementationSpecific        
            
